<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پرسشنامه نشست علمی فیزیک کوانتوم</title>
<style>
:root{--bg1:#0b1026;--bg2:#1b1f4b;--gold:#e8b86a;--gold2:#f6dca4;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--tx:#f3f4fb;--mut:#aab0d0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:var(--tx);background:radial-gradient(1200px 700px at 80% -10%,#3b2f7a 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0f5a73 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;animation:float 14s ease-in-out infinite}
.o1{width:280px;height:280px;background:#7c5cff;top:10%;left:-80px}
.o2{width:240px;height:240px;background:#18c1c9;bottom:5%;right:-60px;animation-delay:-6s}
@keyframes float{50%{transform:translateY(-40px) translateX(20px)}}
.logo{position:fixed;top:12px;right:12px;z-index:5;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.logo img{display:block;height:54px;width:auto}
main{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:110px 18px 40px}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
h1{margin:0 0 10px;font-size:26px;line-height:1.7;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:21px;line-height:1.8}
p.sub{color:var(--mut);line-height:2;margin:0 0 20px}
.atom{font-size:54px;text-align:center;margin-bottom:6px;animation:spin 8s linear infinite;display:block;width:max-content;margin-inline:auto}
@keyframes spin{to{transform:rotate(360deg)}}
label{display:block;margin:0 0 8px;color:var(--gold2);font-size:15px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:14px 16px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,184,106,.18)}
textarea{min-height:150px;resize:vertical;line-height:2}
.ltr{direction:ltr;text-align:center;letter-spacing:4px;font-size:20px}
.row{display:flex;gap:10px;margin-top:22px}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 22px;transition:.2s}
.pri{flex:1;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d05;font-weight:700;box-shadow:0 10px 26px rgba(232,184,106,.3)}
.pri:hover{transform:translateY(-2px)}
.sec{background:rgba(255,255,255,.1);color:var(--tx);border:1px solid var(--line)}
.err{color:#ff9aa8;min-height:22px;margin-top:10px;font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:9px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#7c5cff);transition:.4s}
.rev{background:rgba(0,0,0,.22);border-radius:16px;padding:14px 16px;margin-bottom:10px;line-height:2}
.rev b{color:var(--gold2)}
.rev span{white-space:pre-wrap;word-break:break-word}
.hide{display:none!important}
.ok{text-align:center;padding:20px 0}
.ok .big{font-size:64px}
/* admin */
.wide{max-width:960px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.cnt{color:var(--mut)}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.item h3{margin:0 0 10px;font-size:18px;color:var(--gold2)}
.item .meta{color:var(--mut);font-size:13px;margin-bottom:10px;direction:ltr;text-align:right}
.blk{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;margin-top:10px}
.blk .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--gold2);font-size:14px}
.blk .t{white-space:pre-wrap;line-height:2;word-break:break-word}
.cp{padding:6px 14px;font-size:13px;background:rgba(255,255,255,.12);color:var(--tx);border:1px solid var(--line)}
.cp.done{background:#1c8f5a}
.note{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.9}
@media(max-width:480px){.logo img{height:42px}main{padding-top:92px}.card{padding:24px 18px}}
</style>
</head>

const faDigits = s => (s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const esc = s => (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin = () => norm(S.first)===norm(ADMIN_FIRST) && norm(S.last)===norm(ADMIN_LAST);

function validNid(c){
  if(!/^\d{10}$/.test(c)||/^(\d)\1{9}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=(+c[i])*(10-i);
  const r=s%11, k=+c[9];
  return r<2 ? k===r : k===11-r;
}

function bar(){return `<div class="bar"><i style="width:${(S.step/TOTAL)*100}%"></i></div>`}
function nav(next="ادامه",back=true){
  return `<div class="err" id="err"></div><div class="row">${back?'<button class="sec" onclick="go(-1)">قبلی</button>':''}<button class="pri" onclick="nextStep()">${next}</button></div>`;
}
function err(m){document.getElementById("err").textContent=m}

function render(){
  const st=S.step; let h="";
  if(st===0){
    h=`<span class="atom">⚛️</span>
    <h1>پرسشنامه نشست علمی فیزیک کوانتوم</h1>
    <p class="sub">به این پرسشنامه خوش آمدید. در چند مرحله‌ی کوتاه نام و مشخصات خود و نظرتان درباره‌ی نشست علمی استاد طباطبایی را ثبت می‌کنید.</p>
    <div class="row"><button class="pri" onclick="go(1)">شروع پرسشنامه ✨</button></div>`;
  }else if(st===1){
    h=bar()+`<h2>نام شما چیست؟</h2><p class="sub">لطفاً نام خود را به فارسی بنویسید.</p>
    <label>نام</label><input id="f" value="${esc(S.first)}" autocomplete="off" autofocus>`+nav("ادامه",true);
  }else if(st===2){
    h=bar()+`<h2>نام خانوادگی</h2><p class="sub">نام خانوادگی خود را بنویسید.</p>
    <label>نام خانوادگی</label><input id="f" value="${esc(S.last)}" autocomplete="off" autofocus>`+nav();
  }else if(st===3){
    h=bar()+`<h2>کد ملی</h2><p class="sub">کد ملی ۱۰ رقمی خود را وارد کنید.</p>
    <label>کد ملی</label><input id="f" class="ltr" inputmode="numeric" maxlength="10" value="${esc(S.nid)}" autocomplete="off">`+nav();
  }else if(st===4){
    h=bar()+`<h2>نظر شما درباره‌ی نشست علمی</h2><p class="sub">نظر شما درباره‌ی نشست علمی فیزیک کوانتوم با سخنرانی استاد طباطبایی چیست؟ هر آنچه دوست دارید بنویسید.</p>
    <label>نظر شما</label><textarea id="f" placeholder="نظر خود را اینجا بنویسید...">${esc(S.opinion)}</textarea>`+nav();
  }else if(st===5){
    h=bar()+`<h2>آنچه از نشست فهمیدید</h2><p class="sub">با زبان خودتان بنویسید در این نشست چه چیزهایی یاد گرفتید و چه مطالبی را متوجه شدید.</p>
    <label>آموخته‌های شما</label><textarea id="f" placeholder="مطالبی که فهمیدید...">${esc(S.learned)}</textarea>`+nav("بازبینی پاسخ‌ها");
  }else if(st===6){
    h=bar()+`<h2>بازبینی و تأیید</h2><p class="sub">پاسخ‌های خود را بررسی کنید و در صورت درست بودن، تأیید را بزنید.</p>
    <div class="rev"><b>نام و نام خانوادگی:</b> <span>${esc(S.first)} ${esc(S.last)}</span></div>
    <div class="rev"><b>کد ملی:</b> <span>${esc(S.nid)}</span></div>
    <div class="rev"><b>نظر درباره‌ی نشست:</b><br><span>${esc(S.opinion)}</span></div>
    <div class="rev"><b>آنچه فهمیدید:</b><br><span>${esc(S.learned)}</span></div>
    <div class="err" id="err"></div>
    <div class="row"><button class="sec" onclick="go(-1)">ویرایش</button><button class="pri" id="sendb" onclick="send()">تأیید و ارسال ✅</button></div>`;
  }else if(st===7){
    h=`<div class="ok"><div class="big">🎉</div><h1>ممنون از شما!</h1><p class="sub">پاسخ‌های شما با موفقیت ثبت و ارسال شد.</p></div>`;
  }
  app.className="";
  app.innerHTML=`<div class="card">${h}</div>`;
  const f=document.getElementById("f"); if(f) setTimeout(()=>f.focus(),50);
  if(f&&f.tagName==="INPUT") f.addEventListener("keydown",e=>{if(e.key==="Enter")nextStep()});
}

function go(d){S.step+=d;render()}

function nextStep(){
  const f=document.getElementById("f"); const v=f?f.value.trim():"";
  if(S.step===1){ if(v.length<2) return err("لطفاً نام خود را وارد کنید."); S.first=v; go(1);}
  else if(S.step===2){
    if(v.length<2) return err("لطفاً نام خانوادگی را وارد کنید.");
    S.last=v;
    if(isAdmin()) return openAdmin();
    go(1);
  }
  else if(S.step===3){ const n=faDigits(v); if(!validNid(n)) return err("کد ملی معتبر نیست؛ باید ۱۰ رقم و صحیح باشد."); S.nid=n; go(1);}
  else if(S.step===4){ if(v.length<3) return err("لطفاً نظر خود را بنویسید."); S.opinion=v; go(1);}
  else if(S.step===5){ if(v.length<3) return err("لطفاً آنچه فهمیدید را بنویسید."); S.learned=v; go(1);}
}

async function send(){
  const b=document.getElementById("sendb"); b.disabled=true; b.textContent="در حال ارسال...";
  const rec={first:S.first,last:S.last,nid:S.nid,opinion:S.opinion,learned:S.learned,time:new Date().toISOString()};
  try{
    if(DB_URL){
      const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/submissions",{method:"POST",headers:{...HDR,"Prefer":"return=minimal"},body:JSON.stringify({first_name:rec.first,last_name:rec.last,national_id:rec.nid,opinion:rec.opinion,learned:rec.learned})});
      if(!r.ok) throw new Error("http "+r.status);
    }else{
      const a=JSON.parse(localStorage.getItem(LS)||"[]"); a.push(rec); localStorage.setItem(LS,JSON.stringify(a));
    }
    S.step=7; render();
  }catch(e){
    b.disabled=false; b.textContent="تأیید و ارسال ✅";
    err("ارسال انجام نشد. اینترنت را بررسی کنید و دوباره تلاش کنید.");
  }
}

/* ---------- پنل مدیریت ---------- */
let DATA=[];
async function loadData(){
  if(DB_URL){
    const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/submissions?select=*&order=created_at.desc",{headers:HDR});
    if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json();
    return j.map(x=>({first:x.first_name,last:x.last_name,nid:x.national_id,opinion:x.opinion,learned:x.learned,time:x.created_at}));
  }
  return JSON.parse(localStorage.getItem(LS)||"[]");
}
async function openAdmin(){
  app.className="wide";
  app.innerHTML=`<div class="card"><p class="sub">در حال بارگذاری پنل مدیریت...</p></div>`;
  try{ DATA=await loadData(); }catch(e){ DATA=[]; }
  DATA.sort((a,b)=>(b.time||"").localeCompare(a.time||""));
  drawAdmin();
}
function drawAdmin(){
  const items=DATA.map((d,i)=>`
  <div class="item">
    <h3>${esc(d.first)} ${esc(d.last)}</h3>
    <div class="meta">${new Date(d.time).toLocaleString("fa-IR")}</div>
    <div class="blk"><div class="h"><span>کد ملی</span><button class="cp" onclick="cp(this,${i},'nid')">کپی</button></div><div class="t">${esc(d.nid)}</div></div>
    <div class="blk"><div class="h"><span>نظر درباره‌ی نشست</span><button class="cp" onclick="cp(this,${i},'opinion')">کپی</button></div><div class="t">${esc(d.opinion)}</div></div>
    <div class="blk"><div class="h"><span>آنچه فهمیده</span><button class="cp" onclick="cp(this,${i},'learned')">کپی</button></div><div class="t">${esc(d.learned)}</div></div>
    <div class="row"><button class="sec" onclick="cp(this,${i},'all')">کپی همه‌ی پاسخ‌های این فرد</button></div>
  </div>`).join("");
  app.innerHTML=`<div class="card">
    <div class="top"><h1 style="margin:0">پنل مدیریت</h1><span class="cnt">${DATA.length} پاسخ ثبت شده</span></div>
    <div class="row" style="margin:0 0 16px"><button class="sec" onclick="openAdmin()">🔄 بروزرسانی</button><button class="sec" onclick="cpAll(this)">کپی همه</button><button class="sec" onclick="location.reload()">خروج</button></div>
    ${items||'<p class="sub">هنوز پاسخی ثبت نشده است.</p>'}
    ${DB_URL?"":'<div class="note">⚠️ آدرس پایگاه‌داده تنظیم نشده؛ فقط پاسخ‌های ثبت‌شده روی همین مرورگر نمایش داده می‌شوند.</div>'}
  </div>`;
}
function fmt(d){return `نام: ${d.first} ${d.last}\nکد ملی: ${d.nid}\nنظر درباره‌ی نشست:\n${d.opinion}\nآنچه فهمیده:\n${d.learned}`}
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  const o=btn.textContent;btn.textContent="کپی شد ✓";btn.classList.add("done");setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1200);
}
function cp(btn,i,k){copyText(k==="all"?fmt(DATA[i]):DATA[i][k],btn)}
function cpAll(btn){copyText(DATA.map(fmt).join("\n\n----------\n\n"),btn)}

render();
</script>
</body>
